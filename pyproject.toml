[project]
name = "recipe-drawer"
version = "0.1.0"
description = "Self-hosted recipe book that imports recipes from links, images or text using LLM-based extraction."
readme = "README.md"
authors = [
    { name = "alina-geissler" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
extend-exclude = ["scratch"]

[tool.mypy]
python_version = "3.14"
exclude = "^scratch/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
